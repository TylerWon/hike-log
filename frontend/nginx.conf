server {
    listen 8080;

    # Allow all requests to be handled regardless of hostname
    server_name _;

    # Set the directory used as the site’s root. For example, nginx tries to serve /usr/share/nginx/html/test for a 
    # request for /test. The path matches where the Dockerfile copies Vite’s build output into so the app files are 
    # served
    root /usr/share/nginx/html;

    # Set the default file served for a request. This means a GET to / becomes /index.html (i.e. the app's entrypoint) 
    # under root (i.e. /usr/share/nginx/html/index.html) instead of a directory listing (i.e. /usr/share/nginx/html/)
    index index.html;

    # Handle health checks
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Handle requests for the app's static assets
    location /assets/ {
        # Allow assets to be cached for up to a year. This is safe as Vite puts a content hash in the asset filename: a 
        # new build gets new names, so old assets do not need to be invalidated
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Serve the file if it exists, otherwise return 404
        try_files $uri = 404;
    }

    # Handle requests for the app's entrypoint
    location = /index.html {
        # Do not allow the entrypoint to be cached. index.html hardcodes the names of the assets it uses. If an old 
        # index.html is reused after a deploy due to caching, the browser will request the old asset files (which are 
        # gone) and the app will be broken until the cache expires
        add_header Cache-Control "no-cache";
    }

    # Handle all other requests
    location / {
        # 1. Serve the file if it exists ($uri)
        # 2. Else treat it as a directory ($uri/)
        # 3. Else fall back to /index.html so the app loads and React Router can try to handle the path
        try_files $uri $uri/ /index.html;
    }
}
